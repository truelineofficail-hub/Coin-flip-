  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  button:disabled{cursor:default}

  /* ---------- backdrop ---------- */
  .bg{position:fixed;inset:0;z-index:0;background:#000}

  /* ---------- layout ---------- */
  .app{position:relative;z-index:1;height:100vh;height:100dvh;max-width:460px;margin:0 auto;
    padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px}

  .snd{position:absolute;top:max(14px,env(safe-area-inset-top));right:18px;width:36px;height:36px;border-radius:10px;
    border:1px solid rgba(135,135,135,.3);display:grid;place-items:center;z-index:6;transition:box-shadow .25s}
  .snd:active{box-shadow:0 0 14px rgba(135,135,135,.4)}
  .inst{position:absolute;top:max(14px,env(safe-area-inset-top));left:18px;height:36px;padding:0 12px;border-radius:10px;
    border:1px solid rgba(135,135,135,.3);display:flex;align-items:center;gap:8px;z-index:6;
    font-size:10px;font-weight:600;letter-spacing:2.5px;color:#8e8e8e;transition:box-shadow .25s}
  .inst[hidden]{display:none}
  .inst:active{box-shadow:0 0 14px rgba(135,135,135,.4)}
  .inst svg{width:15px;height:15px;stroke:#8e8e8e;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .toast{position:absolute;left:18px;right:18px;top:62px;z-index:7;padding:12px 14px;border-radius:10px;border:1px solid rgba(135,135,135,.35);
    background:#0b0b0b;color:#9a9a9a;font-size:12px;line-height:1.4;text-align:center;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .3s,transform .3s}
  .toast.show{opacity:1;transform:none}
  .snd svg{width:17px;height:17px;stroke:rgba(135,135,135,.85);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .snd .x{display:none}.snd.off .x{display:block}.snd.off .w{display:none}

  .stagewrap{flex:1;min-height:0;position:relative;container-type:size;grid-area:stage}
  .stage{position:absolute;inset:0;
    --d:min(60cqw,45cqh,300px);
    --t:calc(var(--d) * .07);
    perspective:1100px;perspective-origin:50% 62%}

  /* soft glow behind coin (no plate) */
  .stage{--ha:.14}
  .platter{position:absolute;left:50%;top:62%;width:calc(var(--d) * 1.9);height:calc(var(--d) * 1.9);
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(135,135,135,var(--ha)) 0%,rgba(135,135,135,.05) 38%,rgba(135,135,135,0) 68%)}
  .ripple{position:absolute;left:50%;top:62%;width:calc(var(--d) * 1.3);height:calc(var(--d) * 1.3);margin:calc(var(--d) * -.65) 0 0 calc(var(--d) * -.65);
    border-radius:50%;border:1px solid var(--ring);opacity:0;pointer-events:none}
  .shadow{position:absolute;left:50%;top:62%;width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
    border-radius:50%;background:rgba(0,0,0,.65);pointer-events:none;z-index:2;will-change:transform,filter}

  /* coin */
  .coinbox{position:absolute;left:50%;top:62%;width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
    transform-style:preserve-3d;z-index:3}
  .toss,.tilt,.coin{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
  .coin{--s:-80%}
  .layer{position:absolute;inset:0;border-radius:50%}
  .face{position:absolute;inset:0;border-radius:50%;overflow:hidden;background-size:cover;background-position:center;
    -webkit-backface-visibility:hidden;backface-visibility:hidden}
  .face.h{background-image:var(--heads);transform:translateZ(calc(var(--t) / 2))}
  .face.t{background-image:var(--tails);transform:rotateX(180deg) translateZ(calc(var(--t) / 2))}
  /* static specular + rim light */
  .face::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 28% 20%,rgba(255,255,255,.55),rgba(255,255,255,0) 42%),
               radial-gradient(circle at 50% 50%,rgba(255,255,255,0) 62%,rgba(255,255,255,.18) 100%);
    mix-blend-mode:soft-light;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 0 14px rgba(255,255,255,.10)}
  /* moving glint */
  .face::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(112deg,transparent calc(var(--s) - 20%),rgba(255,255,255,.28) calc(var(--s) - 7%),rgba(255,255,255,.95) var(--s),rgba(255,255,255,.28) calc(var(--s) + 7%),transparent calc(var(--s) + 20%));
    mix-blend-mode:overlay}

  /* idle sparkle */
  .glint{position:absolute;left:calc(50% - var(--d) * .30);top:calc(62% - var(--d) * .32);width:26px;height:26px;margin:-13px 0 0 -13px;z-index:4;pointer-events:none;opacity:0;
    animation:glint 5.2s ease-in-out infinite 1.2s}
  .glint::before,.glint::after{content:"";position:absolute;left:50%;top:50%;border-radius:2px;background:linear-gradient(90deg,transparent,#aab0b8,transparent);transform:translate(-50%,-50%)}
  .glint::before{width:26px;height:2px}
  .glint::after{width:2px;height:26px;background:linear-gradient(180deg,transparent,#aab0b8,transparent)}
  .stage.flying .glint{animation:none;opacity:0}
  @keyframes glint{0%,6%{opacity:0;transform:scale(.2) rotate(0)}12%{opacity:1;transform:scale(1) rotate(25deg)}20%,100%{opacity:0;transform:scale(.3) rotate(60deg)}}

  .spark{position:absolute;left:50%;top:62%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;pointer-events:none;z-index:5;
    background:radial-gradient(circle,#aab0b8 0%,rgba(170,176,184,.0) 70%);box-shadow:0 0 9px 2px rgba(170,176,184,.85)}

  .stage[data-state=win]{--ha:.34;--ring:rgba(135,135,135,.85)}
  .stage[data-state=lose]{--ha:.06;--ring:rgba(110,110,110,.5)}
  .stage[data-state=edge]{--ha:.3;--ring:rgba(150,150,150,.8)}

  /* ---------- controls (minimal) ---------- */
  .panel{flex:none;grid-area:panel;padding:0 2px}
  .views{display:grid}
  .view{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;transition:opacity .35s ease,transform .35s ease,visibility 0s}
  .view.off{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease,visibility 0s .3s}
  .choose,.label{text-align:center;font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:rgba(135,135,135,.5)}
  .choices{display:flex;gap:10px;margin-top:12px}
  .choice,.flip,.again{height:clamp(46px,6.8dvh,54px);border-radius:10px;font-size:12px;font-weight:600;letter-spacing:3px;transition:all .25s ease}
  .choice{flex:1;color:rgba(135,135,135,.8);border:1px solid rgba(135,135,135,.35);background:transparent}
  .choice:active:not(:disabled),.flip:active:not(:disabled),.again:active{transform:scale(.98)}
  .choice.selected{background:#262626;color:#a8a8a8;border-color:#7a7a7a;box-shadow:0 0 22px rgba(120,120,120,.45),inset 0 0 14px rgba(120,120,120,.15)}
  .choice:disabled:not(.selected){opacity:.4}
  .flip,.again{width:100%;margin-top:10px;color:#8e8e8e;border:1px solid #8e8e8e;background:transparent;
    box-shadow:0 0 18px rgba(135,135,135,.3),inset 0 0 14px rgba(135,135,135,.1)}
  .flip:disabled{color:rgba(135,135,135,.25);border-color:rgba(135,135,135,.14);box-shadow:none}
  .value{text-align:center;margin-top:8px;font-size:clamp(30px,5.2dvh,38px);font-weight:600;letter-spacing:5px;line-height:1.1}
  .value.win{color:#a0a0a0;text-shadow:0 0 22px rgba(135,135,135,.7)}
  .value.edge{color:#8a8a8a;letter-spacing:6px;text-shadow:0 0 22px rgba(135,135,135,.6)}
  .value.lose{color:#555;text-shadow:none}
  .message{text-align:center;margin:4px 0 2px;font-size:13px;color:rgba(135,135,135,.5)}

  /* short landscape: coin left, controls right */
  @media (max-height:520px) and (min-aspect-ratio:1/1){
    .app{max-width:900px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;
      grid-template-areas:"stage head" "stage panel";column-gap:22px;row-gap:6px}
      h1{font-size:26px}.snd{display:none}
  }
  @media (prefers-reduced-motion:reduce){.glint{animation:none}}
</style>
</head>
<body>
<div class="bg"></div>

<main class="app">
  <button class="inst" id="inst" hidden aria-label="Install app"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>INSTALL</button>
  <div class="toast" id="toast" role="status"></div>
  <button class="snd" id="snd" aria-label="Toggle sound">
    <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>

  <section class="stagewrap">
    <div class="stage" id="stage">
      <div class="platter" id="platter"></div>
      <div class="ripple" id="ripple"></div>
      <div class="shadow" id="shadow"></div>
      <div class="glint"></div>
      <div class="coinbox" id="coinbox">
        <div class="toss" id="toss"><div class="tilt" id="tilt"><div class="coin" id="coin">
          <div class="face h"></div>
          <div class="face t"></div>
        </div></div></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="views">
      <div class="view" id="vChoose">
        <div class="choose" id="choose">Choose your side</div>
        <div class="choices">
          <button class="choice" id="heads" aria-pressed="false">HEADS</button>
          <button class="choice" id="tails" aria-pressed="false">TAILS</button>
        </div>
        <button class="flip" id="flip" disabled>FLIP COIN</button>
      </div>
      <div class="view off" id="vResult" aria-live="polite">
        <div class="label">THE COIN LANDED ON</div>
        <div class="value" id="value"></div>
        <div class="message" id="message"></div>
        <button class="again" id="again">PLAY AGAIN</button>
      </div>
    </div>
  </section>
</main>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const stage=$('stage'),platter=$('platter'),ripple=$('ripple'),shadow=$('shadow'),coinbox=$('coinbox'),
        toss=$('toss'),tilt=$('tilt'),coin=$('coin'),headsB=$('heads'),tailsB=$('tails'),flipB=$('flip'),
        choose=$('choose'),vChoose=$('vChoose'),vResult=$('vResult'),valueEl=$('value'),msg=$('message'),
        again=$('again'),snd=$('snd');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* coin thickness: stacked discs shaded like a cylinder wall */
  const N=14;
  for(let i=0;i<N;i++){
    const u=i/(N-1), e=Math.abs(u*2-1), l=Math.round(56-30*e*e-4*e);
    const el=document.createElement('i'); el.className='layer';
    el.style.transform='translateZ(calc(var(--t) * '+((u-.5)*.94).toFixed(3)+'))';
    el.style.background='radial-gradient(circle at 35% 30%,hsl(0 0% '+(l+10)+'%),hsl(0 0% '+(l-12)+'%))';
    coin.insertBefore(el,coin.firstChild);
  }

  let selected='',locked=false,flying=false,rest=0,soundOn=true;
  let tpx=0,tpy=0,px=0,py=0;

  /* ---------- sound (tiny synthesized metal clink) ---------- */
  let ac=null;
  function ping(v){
    if(!soundOn) return;
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      const t=ac.currentTime,f=2300+Math.random()*500;
      [[1,.20,.55],[1.52,.12,.38],[2.31,.07,.25],[3.4,.04,.15]].forEach(([m,g0,dur])=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='sine';o.frequency.value=f*m;
        g.gain.setValueAtTime(g0*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur*(v>.7?1:.6));
        o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05);
      });
    }catch(e){}
  }
  const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
  snd.onclick=()=>{soundOn=!soundOn;snd.classList.toggle('off',!soundOn)};

  /* ---------- rendering ---------- */
  const setSheen=s=>coin.style.setProperty('--s',s.toFixed(1)+'%');
  function render(a,lift,sc,rz){
    coin.style.transform='rotateX('+a.toFixed(2)+'deg)';
    toss.style.transform='translate3d(0,'+(-lift).toFixed(2)+'px,0) scale('+sc.toFixed(4)+') rotateZ('+rz.toFixed(2)+'deg)';
  }
  function renderShadow(a,hn,d){
    const cs=Math.max(.07,Math.abs(Math.cos(a*Math.PI/180)));
    const h=Math.max(0,hn), off=d*(.035+.17*h), k=1-.14*Math.min(1,h);
    shadow.style.transform='translate('+(off*.5).toFixed(1)+'px,'+off.toFixed(1)+'px) scale('+k.toFixed(3)+','+(k*cs).toFixed(3)+')';
    shadow.style.opacity=(.52-.30*Math.min(1,h)).toFixed(3);
    shadow.style.filter='blur('+(5+15*Math.min(1.2,h)).toFixed(1)+'px)';
  }

  /* idle: gentle float, pointer parallax tilt, periodic glint sweep */
  function idle(now){
    if(!flying){
      const d=coinbox.offsetWidth;
      px+=(tpx-px)*.07;py+=(tpy-py)*.07;
      const fl=Math.sin(now/760)*d*.011;
      tilt.style.transform='rotateX('+(-py*4).toFixed(2)+'deg) rotateY('+(px*5).toFixed(2)+'deg)';
      render(rest,fl+d*.011,1,0);
      renderShadow(rest,(fl+d*.011)/(d*.55),d);
      const ph=(now%5200)/5200;
      setSheen((ph<.5?-40+ph/.5*180:-90)+px*30-py*10);
    }
    requestAnimationFrame(idle);
  }
  requestAnimationFrame(idle);
  addEventListener('pointermove',e=>{tpx=(e.clientX/innerWidth-.5)*2;tpy=(e.clientY/innerHeight-.5)*2},{passive:true});
  document.addEventListener('pointerleave',()=>{tpx=tpy=0});

  /* ---------- effects ---------- */
  function sparks(){
    if(reduce) return;
    const d=coinbox.offsetWidth;
    for(let i=0;i<12;i++){
      const s=document.createElement('i');s.className='spark';stage.appendChild(s);
      const th=Math.random()*Math.PI*2,r0=d*.46,r1=d*(.62+Math.random()*.4),sz=.5+Math.random()*.9;
      const a=s.animate([
        {transform:'translate('+Math.cos(th)*r0+'px,'+Math.sin(th)*r0+'px) scale('+sz+')',opacity:1},
        {transform:'translate('+Math.cos(th)*r1+'px,'+(Math.sin(th)*r1-d*.12)+'px) scale(0)',opacity:0}
      ],{duration:650+Math.random()*350,easing:'cubic-bezier(.15,.7,.3,1)'});
      a.onfinish=()=>s.remove();
    }
  }
  function pulse(strong){
    if(reduce) return;
    ripple.animate([{transform:'scale(.82)',opacity:strong?.8:.4},{transform:'scale(1.45)',opacity:0}],{duration:strong?900:600,easing:'ease-out'});
    platter.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:'translate(-50%,-50%) scale('+(strong?1.035:1.015)+')'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:320,easing:'ease-out'});
  }
  function impact(v){ping(v);buzz(v>.7?22:10);pulse(v>.7)}

  /* ---------- flip ---------- */
  const ease=q=>q*(2-q);
  function startFlip(){
    const answer=Math.random()<.01?'EDGE':(Math.random()<.5?'HEADS':'TAILS');  // 1 in 100: lands on its edge
    const turns=reduce?2:4+(Math.random()<.5?0:1);
    const start=rest,end=turns*360+(answer==='TAILS'?180:answer==='EDGE'?90:0);
    const DUR=reduce?1100:2600,H=stage.clientHeight*(reduce?.18:.36),d=coinbox.offsetWidth;
    const A_FL=end-130,A_B1=end-18;
    const t0=performance.now();let hit1=false,hit2=false;
    flying=true;stage.classList.add('flying');
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){}

    function step(now){
      const t=Math.min(1,(now-t0)/DUR);let y,a;
      if(t<.70){const p=t/.70;y=4*p*(1-p);a=start+(A_FL-start)*p}
      else if(t<.88){const q=(t-.70)/.18;y=.07*4*q*(1-q);a=A_FL+(A_B1-A_FL)*ease(q);if(!hit1){hit1=true;impact(1)}}
      else{const q=(t-.88)/.12;y=.018*4*q*(1-q);a=A_B1+(end-A_B1)*ease(q);if(!hit2){hit2=true;impact(.5)}}
      const k=Math.pow(1-t,1.3);
      const rz=Math.sin(t*11)*7*k,ry=Math.sin(t*17)*5*k,sc=1+.28*Math.min(1.2,y);
      tilt.style.transform='rotateY('+(ry+px*5*(1-t)).toFixed(2)+'deg) rotateX('+(-py*4*(1-t)).toFixed(2)+'deg)';
      render(a,y*H,sc,rz);
      renderShadow(a,y,d);
      setSheen(50+88*Math.sin(a*Math.PI/180+.5));
      if(t<1) requestAnimationFrame(step); else land(answer,end);
    }
    requestAnimationFrame(step);
  }

  function land(answer,end){
    rest=end%360;flying=false;stage.classList.remove('flying');
    sparks();
    setTimeout(()=>showResult(answer),380);
  }

  function showResult(answer){
    const edge=answer==='EDGE',win=answer===selected;
    stage.dataset.state=edge?'edge':(win?'win':'lose');
    valueEl.textContent=answer;valueEl.className='value '+(edge?'edge':(win?'win':'lose'));
    msg.textContent=edge?'It landed on its edge. A 1 in 100 chance.':(win?'You guessed correctly.':'Not this time.');
    vChoose.classList.add('off');vResult.classList.remove('off');
  }

  /* ---------- UI ---------- */
  function select(side){
    if(locked) return;
    selected=side;
    headsB.classList.toggle('selected',side==='HEADS');tailsB.classList.toggle('selected',side==='TAILS');
    headsB.setAttribute('aria-pressed',side==='HEADS');tailsB.setAttribute('aria-pressed',side==='TAILS');
    choose.textContent='You chose '+(side==='HEADS'?'Heads':'Tails');
    flipB.disabled=false;
  }
  headsB.onclick=()=>select('HEADS');
  tailsB.onclick=()=>select('TAILS');

  flipB.onclick=()=>{
    if(!selected||locked) return;
    locked=true;flipB.disabled=true;headsB.disabled=true;tailsB.disabled=true;
    flipB.textContent='FLIPPING…';
    startFlip();
  };

  again.onclick=()=>{
    if(flying) return;
    selected='';locked=false;
    headsB.disabled=false;tailsB.disabled=false;
    headsB.classList.remove('selected');tailsB.classList.remove('selected');
    headsB.setAttribute('aria-pressed','false');tailsB.setAttribute('aria-pressed','false');
    flipB.disabled=true;flipB.textContent='FLIP COIN';choose.textContent='Choose your side';
    stage.dataset.state='';
    vResult.classList.add('off');vChoose.classList.remove('off');
    if(rest!==0){ /* turn the coin back to heads */
      flying=true;const t0=performance.now(),D=650;
      (function back(now){
        const q=Math.min(1,(now-t0)/D),a=rest+(360-rest)*(q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2);
        render(a,0,1,0);renderShadow(a,0,coinbox.offsetWidth);setSheen(-40+q*150);
        if(q<1) requestAnimationFrame(back); else {rest=0;flying=false}
      })(t0);
    }
  };
})();
</script>
<script>
(()=>{
  /* offline: register the service worker (needs https or localhost) */
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
  /* install button */
  const inst=document.getElementById('inst'),toast=document.getElementById('toast');
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let dip=null,tm=0;
  const say=t=>{toast.textContent=t;toast.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>toast.classList.remove('show'),4500)};
  if(standalone) return;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;inst.hidden=false});
  if(ios) inst.hidden=false;
  inst.onclick=async()=>{
    if(dip){dip.prompt();try{await dip.userChoice}catch(e){}dip=null;inst.hidden=true}
    else if(ios){say('Tap the Share button, then \u201cAdd to Home Screen\u201d.')}
    else say('Open your browser menu and choose \u201cInstall app\u201d.');
  };
  addEventListener('appinstalled',()=>{inst.hidden=true;say('Installed. Guess now works fully offline.')});
})();
</script>
</body>
</html>
